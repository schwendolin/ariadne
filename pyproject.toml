[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ariadne-recon"
version = "0.1.0.dev0"
description = "Flugschreiber und Kartograf für Pentests unter Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sven Cotting" }]
dependencies = [
  "pydantic>=2.7",
  "sqlcipher3>=0.6.2",
  "pyrage>=1.2",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "watchdog>=4",
  "defusedxml>=0.7",
  "google-re2>=1.1",
  "tomlkit>=0.12",
  "pyte>=0.8",
  "anthropic>=1.0",
  # Mozilla-Liste für die Cloud-KI: TLS nie gegen den Zertifikatsspeicher des Systems (E98)
  "certifi>=2024.2.2",
  "mss>=9",
  "python-xlib>=0.33",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pexpect>=4.9",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
ariadne = "ariadne.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne"]
# Die gebaute Weboberfläche (scripts/build-ui.sh) gehört ins Wheel, auch der versteckte Build-Vermerk.
artifacts = ["src/ariadne/web/static/**"]

[tool.hatch.build.targets.sdist]
# Hatch liest nur die .gitignore im Wurzelverzeichnis: alles aus webui/.gitignore hier ausdrücklich ausschliessen
exclude = [
  "webui/node_modules", "webui/dist", "webui/test-results", "webui/.e2e", "webui/.vite",
  "webui/coverage", "webui/playwright-report", "webui/**/*.log", ".venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = [
  "pty: startet echte Shells in einem PTY",
  "slow: langsame Tests",
  "e2e: End-to-End über Shim, Daemon und Auswertung",
]
# Nicht geschlossene Dateien, Sockets und Verbindungen sofort als Fehler melden,
# damit Lecks im Produktcode nicht im Rauschen der Tests verschwinden.
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

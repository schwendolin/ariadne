<title>Ariadne Karte und Liste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: links die Karte, randlos und gross (wo stehe ich), rechts eine Spalte, die zwischen
   «Als Nächstes» und dem Host-Detail wechselt (was ist jetzt zu tun). Kopfzeile schmal,
   Kartenwerkzeuge schweben klein auf der Karte, alles Weitere liegt in Popovern und im Menü.
   Farbe nur für Zugriff ($ user, # admin/root), den Faden und Handlungsbedarf. */
:root {
  --bg: #ECF0F1;
  --map: #F6F8F8;
  --veil: #F6F8F8E8;
  --panel: #FAFBFB;
  --surface: #FFFFFF;
  --surface-2: #EDF1F2;
  --ink: #16212A;
  --ink-2: #485660;
  --ink-3: #55626C;
  --line: #DAE2E5;
  --line-2: #B9C5CA;
  --grid: #3E6E8424;
  --seg: #E4EBEE;
  --fog: #8A98A1;
  --found: #E7ECEE;
  --scanned: #D3DEE3;
  --hatch: #AEBBC1;
  --faden: #A51D2D;
  --faden-soft: #F4DCDF;
  --rec: #DB4A2B;
  --user: #1B6A6F;
  --user-bg: #D7EBEA;
  --root: #6A2C67;
  --root-bg: #EFDFEC;
  --warn: #8F4C00;
  --warn-bg: #FAEBD2;
  --on-strong: #FFFFFF;
  --focus: #1F5BD6;
  --pulse: #7D8B95;
  --scrim: #16212A5C;
  --shadow: 0 1px 2px #16212A14, 0 12px 32px #16212A1F;
  --shadow-s: 0 1px 2px #16212A14, 0 2px 8px #16212A0F;

  --f-ui: "IBM Plex Sans", "Segoe UI", "Noto Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", "DejaVu Sans Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-display: "Cormorant SC", "Cormorant Garamond", Georgia, "Times New Roman", serif;

  --t-xs: 11px;
  --t-s: 12px;
  --t-m: 13px;
  --t-b: 14px;
  --t-l: 16px;
  --t-xl: 20px;
  --side-w: 360px;
  --band: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A121A;
    --map: #0D1721;
    --veil: #0D1721E8;
    --panel: #0F1A25;
    --surface: #15212E;
    --surface-2: #1B2938;
    --ink: #DCE4EA;
    --ink-2: #A3B2BE;
    --ink-3: #8D9FAE;
    --line: #213244;
    --line-2: #34495E;
    --grid: #8FB6D01C;
    --seg: #12212E;
    --fog: #6E8597;
    --found: #182634;
    --scanned: #20344A;
    --hatch: #3A5268;
    --faden: #E5535B;
    --faden-soft: #2C1418;
    --rec: #FF7A52;
    --user: #5BB8B8;
    --user-bg: #12333A;
    --root: #CB94D4;
    --root-bg: #33213C;
    --warn: #E3A548;
    --warn-bg: #3A2A12;
    --on-strong: #0A121A;
    --focus: #8DB4FF;
    --pulse: #8E9FAD;
    --scrim: #000000A6;
    --shadow: 0 1px 2px #00000066, 0 14px 34px #00000066;
    --shadow-s: 0 1px 2px #00000066, 0 2px 8px #00000040;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A121A;
  --map: #0D1721;
  --veil: #0D1721E8;
  --panel: #0F1A25;
  --surface: #15212E;
  --surface-2: #1B2938;
  --ink: #DCE4EA;
  --ink-2: #A3B2BE;
  --ink-3: #8D9FAE;
  --line: #213244;
  --line-2: #34495E;
  --grid: #8FB6D01C;
  --seg: #12212E;
  --fog: #6E8597;
  --found: #182634;
  --scanned: #20344A;
  --hatch: #3A5268;
  --faden: #E5535B;
  --faden-soft: #2C1418;
  --rec: #FF7A52;
  --user: #5BB8B8;
  --user-bg: #12333A;
  --root: #CB94D4;
  --root-bg: #33213C;
  --warn: #E3A548;
  --warn-bg: #3A2A12;
  --on-strong: #0A121A;
  --focus: #8DB4FF;
  --pulse: #8E9FAD;
  --scrim: #000000A6;
  --shadow: 0 1px 2px #00000066, 0 14px 34px #00000066;
  --shadow-s: 0 1px 2px #00000066, 0 2px 8px #00000040;
  color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: var(--t-b);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num, time, .tnum { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
kbd {
  font-family: var(--f-mono); font-size: var(--t-xs);
  border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 4px; background: var(--surface); color: var(--ink-2);
}
code { font-family: var(--f-mono); font-size: .92em; background: var(--surface-2); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic .fill { fill: currentColor; stroke: none; }
.ic.s { width: 13px; height: 13px; }
.note { font-size: var(--t-s); color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* App-Rahmen */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }

/* Kopfzeile: Wortmarke und Projekt, Reiter, REC, Suche, Menü */
.top {
  display: flex; align-items: center; gap: 8px 14px; min-height: 48px; padding-inline: 16px; padding-block: 6px;
  background: var(--bg); border-bottom: 1px solid var(--line); min-width: 0; position: relative; z-index: 20;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; grid-area: brand; }
.wordmark {
  font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .05em; line-height: 1;
  text-decoration-line: underline; text-decoration-style: wavy; text-decoration-color: var(--faden);
  text-decoration-thickness: 1px; text-underline-offset: 6px;
}
.proj-name { font-weight: 600; font-size: var(--t-b); }
.pill {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: var(--t-xs); font-weight: 500; border: 1px solid var(--line-2); background: transparent; color: var(--ink-3); white-space: nowrap;
}
.pill-demo { border-style: dashed; grid-area: demo; justify-self: end; }
button.pill { height: 28px; padding: 0 10px; font-size: var(--t-s); font-weight: 600; }
.pill-warn { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
.pill-pres { border-color: var(--ink); color: var(--surface); background: var(--ink); }
.tabs { display: flex; gap: 2px; grid-area: tabs; min-width: 0; }
.tab {
  border: 0; background: transparent; padding: 0 10px; height: 34px; border-radius: 6px; color: var(--ink-2);
  font-size: var(--t-m); font-weight: 500; white-space: nowrap;
}
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); border-radius: 6px 6px 0 0; }
.top-spacer { flex: 1 1 0; min-width: 0; }
.pills { display: inline-flex; gap: 6px; grid-area: pills; }
.hd-btn {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-size: var(--t-m); white-space: nowrap;
}
.hd-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.hd-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--ink-2); }
.hd-btn .kb { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-3); }
#paletteBtn { grid-area: search; }
.menu-wrap { position: relative; grid-area: menu; }

/* REC: kleiner Punkt und Laufzeit, kein roter Block */
.rec {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 11px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-weight: 700; font-size: var(--t-s); letter-spacing: .08em; grid-area: rec; white-space: nowrap;
}
.rec:hover { border-color: var(--ink-3); }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); flex: none; }
.rec[aria-pressed="true"] .rec-dot { animation: recpulse 2.4s ease-in-out infinite; }
.rec-time { font-family: var(--f-mono); font-weight: 500; letter-spacing: 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rec.off { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.rec.off .rec-dot { background: transparent; border: 2px solid var(--warn); }
.rec.pending { cursor: progress; }
.rec.pending .rec-dot { background: transparent; border: 2px dotted var(--ink-3); animation: spin 1.2s linear infinite; }
@keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* Menü und Popover */
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; width: 300px; max-height: calc(100vh - 70px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow);
  padding: 6px; display: grid; gap: 2px;
}
.menu-h { font-size: var(--t-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 10px 8px 4px; }
.menu-row {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 6px; border: 0; background: transparent;
  text-align: left; font-size: var(--t-m); color: var(--ink); cursor: pointer;
}
.menu-row:hover { background: var(--surface-2); }
.menu-row .sub { margin-left: auto; color: var(--ink-3); font-size: var(--t-s); }
.seg-ctl { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; margin: 2px 8px 6px; border-radius: 8px; background: var(--surface-2); }
.seg-ctl button { border: 0; background: transparent; border-radius: 6px; height: 28px; font-size: var(--t-s); color: var(--ink-2); }
.seg-ctl button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-s); }
.menu-note { font-size: var(--t-xs); color: var(--ink-3); padding: 4px 8px 8px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input, .menu-row input[type="checkbox"] {
  appearance: none; width: 30px; height: 18px; border-radius: 999px; background: var(--line-2); position: relative; margin: 0 0 0 auto; cursor: pointer; flex: none;
}
.switch input::after, .menu-row input[type="checkbox"]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked, .menu-row input[type="checkbox"]:checked { background: var(--ink); }
.switch input:checked::after, .menu-row input[type="checkbox"]:checked::after { transform: translateX(12px); }

.pop {
  position: absolute; z-index: 30; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
  box-shadow: var(--shadow); padding: 12px; display: grid; gap: 10px; min-width: 0;
}
.pop h3 { font-size: var(--t-m); font-weight: 600; }
.pop-sub { font-size: var(--t-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.lock-pop { top: calc(100% + 6px); right: 0; width: 320px; font-size: var(--t-m); }

/* Arbeitsfläche: Karte und Spalte */
.main { min-height: 0; min-width: 0; display: grid; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w); min-height: 0; min-width: 0; }
.map-area {
  position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background-color: var(--map);
  background-image: radial-gradient(circle, var(--grid) 1px, transparent 1.4px);
  background-size: 28px 28px;
}
.map-canvas { position: absolute; inset: 0 var(--band) 0 0; overflow: hidden; }
#cy { position: absolute; inset: 0; }
.ov { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; pointer-events: none; }
.map-fallback { position: absolute; left: 12px; bottom: 12px; z-index: 6; max-width: 360px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--ink); border: 1px solid var(--warn); font-size: var(--t-s); display: flex; gap: 8px; }

/* Lagebild: eine kurze Zeile auf der Karte */
.lagebild {
  position: absolute; left: 12px; top: 10px; z-index: 5; max-width: calc(100% - 34px - var(--band));
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; padding: 5px 10px; border-radius: 8px;
  background: var(--veil); font-size: var(--t-s); color: var(--ink-2); min-height: 32px;
}
.lagebild b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.lagebild .sep { color: var(--line-2); }
.lagebild .replay { font-weight: 600; color: var(--ink); }
.since {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; margin-left: 2px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: var(--t-s); font-weight: 500;
}
.since::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); }
.since:hover { border-color: var(--ink-3); }

/* Schwebende Kartenleiste */
.maptools {
  position: absolute; bottom: var(--tools-b, 12px); right: calc(var(--band) + 10px); z-index: 6; display: flex; gap: 2px; padding: 3px;
  border-radius: 9px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-s);
}
.tool {
  height: 28px; padding: 0 9px; display: inline-flex; gap: 6px; align-items: center; border: 0; background: transparent;
  border-radius: 6px; color: var(--ink-2); font-size: var(--t-s); font-weight: 500; white-space: nowrap;
}
.tool:hover { background: var(--surface-2); color: var(--ink); }
.tool[aria-pressed="true"], .tool[aria-expanded="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.layers-pop { bottom: calc(var(--tools-b, 12px) + 44px); right: calc(var(--band) + 10px); width: 310px; max-height: calc(100% - 70px); overflow: auto; }
.lyr {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%;
  padding: 6px 6px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: var(--t-m); color: var(--ink);
}
.lyr:hover { background: var(--surface-2); }
.lyr .lyr-note { grid-column: 2; font-size: var(--t-xs); color: var(--ink-3); }
.lyr .chk { grid-row: 1 / span 2; grid-column: 3; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line-2); display: grid; place-items: center; }
.lyr[aria-pressed="true"] .chk { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.lyr .sw-box { grid-row: 1 / span 2; display: flex; align-items: center; justify-content: center; }
.legend-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: var(--t-s); color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.lg-box { width: 26px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line-2); background: var(--found); display: inline-grid; place-items: center; font-family: var(--f-mono); font-size: 10px; font-weight: 700; flex: none; color: var(--ink-2); }
.lg-box.fog { background: transparent; border-style: dotted; border-color: var(--fog); }
.lg-box.scan { background: var(--scanned); border-color: var(--ink-3); }
.lg-box.user { background: var(--user-bg); border-color: var(--user); color: var(--user); }
.lg-box.root { background: var(--root-bg); border-color: var(--root); color: var(--root); }
.lg-box.dead { background: var(--map); border-color: var(--line); }
.lg-box.linked { outline: 1.5px dashed var(--ink-2); outline-offset: 2px; margin-inline: 3px; }
.lg-box.out { background: transparent; background-image: repeating-linear-gradient(135deg, var(--hatch) 0 1.5px, transparent 1.5px 5px); }
.lg-line { width: 26px; height: 4px; border-radius: 2px; background: var(--faden); flex: none; }
.lg-line.topo { height: 1.5px; background: var(--ink-3); }
.lg-line.lg-cred { height: 1.5px; border-radius: 0; background: repeating-linear-gradient(90deg, var(--ink-3) 0 3px, transparent 3px 6px); }
.lg-ports { font-family: var(--f-mono); font-size: 10px; color: var(--ink-2); }

/* Out of Scope: schraffierter Kartenrand */
.oos-band {
  position: absolute; top: 0; right: 0; bottom: 0; width: var(--band); z-index: 4; border: 0; border-left: 1px solid var(--line);
  background-color: var(--map);
  background-image: repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 7px);
  display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink-3);
}
.oos-band span {
  writing-mode: vertical-rl; transform: rotate(180deg); font-size: var(--t-xs); font-weight: 600; letter-spacing: .06em;
  background: var(--map); padding: 8px 1px; white-space: nowrap;
}
.oos-band:hover span, .oos-band[aria-expanded="true"] span { color: var(--ink); }
.oos-pop { top: 52px; right: calc(var(--band) + 10px); width: min(320px, calc(100% - 50px)); }
.oos-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: start; font-size: var(--t-s); padding-top: 8px; border-top: 1px solid var(--line); color: var(--ink-2); }
.oos-item .mono { font-size: var(--t-m); color: var(--ink); }

/* Abspielleiste: erscheint erst beim Abspielen */
.playbar {
  position: absolute; left: 12px; right: calc(var(--band) + 10px); bottom: 12px; z-index: 6;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 16px; align-items: center;
  padding: 12px 14px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow);
}
.play-mid { display: grid; gap: 4px; min-width: 0; }
.step-caption { font-size: var(--t-m); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-caption b { color: var(--ink); font-variant-numeric: tabular-nums; }
.range { width: 100%; accent-color: var(--ink-2); margin: 0; }
.ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-inline: 2px; }
.ticks span.cur { color: var(--ink); font-weight: 600; }
.play-main { min-width: 132px; }

/* Host-Karten: Standard ruhig, mehr bei Hover, Fokus, Auswahl oder beim Hineinzoomen */
.hc {
  position: absolute; display: grid; grid-auto-rows: max-content; align-content: start; gap: 3px; padding: 7px 9px; border-radius: 9px; text-align: left;
  border: 1.5px solid var(--line-2); background: var(--found); color: var(--ink);
  pointer-events: none; font-size: var(--t-m); line-height: 1.2;
  transition: background-color .3s, border-color .3s, opacity .3s, box-shadow .2s;
}
.hc-r1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.acc-sym {
  width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; flex: none;
  font-family: var(--f-mono); font-weight: 700; font-size: 12px; border: 1.5px solid var(--line-2); color: var(--ink-3); background: var(--map);
}
.acc-sym:empty { border-color: transparent; background: transparent; }
.acc-sym:empty::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--line-2); }
.hc-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hc-hint { margin-left: auto; flex: none; font-size: var(--t-xs); white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }
.hc-hint.n { color: var(--ink-3); }
.hc-hint.cand { text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; }
.hc-hint.warn { color: var(--warn); font-weight: 600; }
.hc-hint.warn .ic { width: 12px; height: 12px; }
.flag-ki, .hc-hint.ki {
  display: inline-flex; align-items: center; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; padding: 0 4px; line-height: 15px;
  border-radius: 3px; border: 1px solid var(--ink-2); color: var(--ink); background: transparent;
}
.hc-ip { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-2); padding-left: 24px; white-space: nowrap; }
.hc-more { display: none; flex-wrap: wrap; gap: 3px 8px; align-items: center; padding-left: 24px; margin-top: 3px; font-size: var(--t-xs); color: var(--ink-2); }
.hc-ports { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-2); }
.hc-ports .cand { border-bottom: 1px dotted var(--ink-3); }
.hc-meta { display: inline-flex; gap: 3px; align-items: center; }
.hc.rich, .ov.zoomed .hc:not(.kali) { height: auto !important; min-height: 50px; z-index: 3; box-shadow: var(--shadow-s); }
.hc.rich .hc-more, .ov.zoomed .hc .hc-more { display: flex; }
.hc.selected { box-shadow: 0 0 0 2px var(--map), 0 0 0 4px var(--ink); }
.hc.linked:not(.selected) { outline: 1.5px dashed var(--ink-2); outline-offset: 5px; }
/* Wissen */
.hc.k-fog { background: transparent; border-style: dotted; border-color: var(--fog); color: var(--ink-2); }
.hc.k-fog .hc-ip { color: var(--ink-3); }
.hc.k-fog .acc-sym { border-style: dotted; border-color: var(--fog); background: transparent; }
.hc.k-found { background: var(--found); }
.hc.k-scan { background: var(--scanned); border-color: var(--ink-3); }
/* Zugriff: Farbe und Symbol */
.hc.acc-user { background: var(--user-bg); border-color: var(--user); }
.hc.acc-user .acc-sym { background: var(--user); border-color: var(--user); color: var(--on-strong); }
.hc.acc-root { background: var(--root-bg); border-color: var(--root); }
.hc.acc-root .acc-sym { background: var(--root); border-color: var(--root); color: var(--on-strong); }
/* Arbeitsstand: nur die Sackgasse fällt zurück */
.hc.w-sackgasse { background: var(--map); border-color: var(--line); color: var(--ink-2); }
.hc.w-sackgasse .hc-name { text-decoration: line-through; text-decoration-color: var(--ink-3); }
.hc.w-sackgasse .hc-ip { color: var(--ink-3); }
.hc.kali { background: var(--surface); border-color: var(--ink-3); }
.hc.kali .acc-sym { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.hc-name.ipname { font-family: var(--f-mono); font-weight: 500; font-size: var(--t-s); }
.hc-ip.state { font-family: var(--f-ui); color: var(--ink-3); }
.hc-r2 { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.hc:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.hc.is-new { animation: fadein .5s ease-out both, pulse 1.4s ease-out .35s 1; }
.hc.is-changed { animation: pulse 1.4s ease-out 1; }
@keyframes fadein { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--pulse); } 75% { box-shadow: 0 0 0 14px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.seg-label { position: absolute; display: grid; pointer-events: none; white-space: nowrap; font-size: var(--t-xs); color: var(--ink-3); }
.seg-label .cidr { font-family: var(--f-mono); font-size: var(--t-s); color: var(--ink-2); font-weight: 500; }
.seg-label.quiet { opacity: .45; }

/* Rechte Spalte */
.side { min-height: 0; min-width: 0; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); overscroll-behavior: contain; }
.side-in { padding-inline: 16px; padding-block: 14px 28px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.q-head { display: flex; align-items: baseline; gap: 10px; padding: 2px 0 6px; }
.q-head h2 { font-size: var(--t-l); font-weight: 600; }
.q-sec { display: grid; gap: 2px; min-width: 0; }
.q-sec-h {
  display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 11px 2px 7px; margin: 0; border: 0; border-top: 1px solid var(--line);
  background: transparent; text-align: left; color: var(--ink-3); font-size: var(--t-xs); font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
}
.q-sec:first-of-type .q-sec-h { border-top: 0; }
button.q-sec-h:hover { color: var(--ink); }
button.q-sec-h:hover .chev { color: var(--ink); }
.q-sec-h .n { font-size: var(--t-m); letter-spacing: 0; text-transform: none; color: var(--ink); font-variant-numeric: tabular-nums; }
.q-sec.attn .q-sec-h .n { color: var(--warn); }
.q-sec-h .prev { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: var(--t-s); }
.q-sec-h .chev { color: var(--ink-3); align-self: center; }
.q-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.q-item {
  display: grid; gap: 3px; padding: 8px 10px; border-radius: 8px; cursor: pointer; min-width: 0; position: relative;
  border: 1px solid transparent;
}
.q-item:hover { background: var(--surface-2); }
.q-item:focus { outline: none; }
.q-item:focus-visible { box-shadow: 0 0 0 2px var(--focus); }
.q-item.cur { background: var(--surface); border-color: var(--line-2); box-shadow: var(--shadow-s); cursor: default; padding: 10px 12px 12px; margin-block: 4px; }
.q-item.cur:focus-visible { box-shadow: 0 0 0 2px var(--focus); }
.q-type { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: var(--t-xs); color: var(--ink-3); font-weight: 500; }
.q-type .k { font-weight: 600; letter-spacing: .03em; }
.q-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
.q-type .t { margin-left: auto; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.q-title { font-size: var(--t-m); color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
.q-title.mono { font-size: 12.5px; }
.q-item.cur .q-title { font-size: var(--t-b); font-weight: 600; }
.q-item.cur .q-title.mono { font-size: var(--t-m); font-weight: 500; }
.q-item.done .q-title { color: var(--ink-3); }
.q-item.done.x .q-title { text-decoration: line-through; }
.q-state { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-weight: 600; }
.q-body { display: grid; gap: 9px; margin-top: 4px; min-width: 0; }
.q-why { font-size: var(--t-s); color: var(--ink-2); line-height: 1.5; }
.q-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.q-acts .push { margin-left: auto; }
.q-grp { display: grid; gap: 2px; min-width: 0; }
.q-grp + .q-grp { margin-top: 6px; }
.q-grp-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 4px 10px 2px; font-size: var(--t-s); color: var(--ink-3); min-width: 0; }
.q-grp-h .cmd { font-family: var(--f-mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 140px; }
.q-grp-act { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 2px 10px 4px; }
.q-hist { font-size: var(--t-s); color: var(--ink-3); padding: 8px 10px 2px; }
.q-hist .mono { color: var(--ink-2); }
.q-foot { display: grid; gap: 6px; padding: 8px 10px 2px; }
.ctx-preview { margin: 0; padding: 8px 10px; background: var(--map); border: 1px solid var(--line); border-radius: 6px; font-family: var(--f-mono); font-size: var(--t-s); line-height: 1.5; overflow-x: auto; white-space: pre; color: var(--ink-2); }
.claims { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.claim { border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 8px; display: grid; gap: 2px; font-size: var(--t-s); background: var(--map); min-width: 0; text-align: left; color: var(--ink-2); }
button.claim:hover { border-color: var(--ink-3); }
.claim .val { font-family: var(--f-mono); font-size: var(--t-m); color: var(--ink); overflow-wrap: anywhere; }
.claim.chosen { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.flags { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tag {
  display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: 4px;
  font-size: var(--t-xs); font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.tag-warn { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.tag-unk { border: 1px dashed var(--warn); color: var(--warn); background: transparent; font-weight: 600; }
.tag-out { background: transparent; border: 1px solid var(--line-2); color: var(--ink-3); background-image: repeating-linear-gradient(135deg, var(--line) 0 1.5px, transparent 1.5px 5px); }
.tag-cand { background: transparent; border: 1px dotted var(--ink-3); color: var(--ink-2); }
.tag-faden { background: var(--faden-soft); color: var(--faden); font-weight: 600; }
.secret { font-family: var(--f-mono); }
.secret.masked { letter-spacing: .1em; color: var(--ink-3); }
.ki-busy { display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-s); color: var(--ink-2); }
.ki-busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--ink); animation: spin .8s linear infinite; flex: none; }

/* Denkanstösse in der Liste */
.idea-crit { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: var(--t-s); color: var(--ink-2); margin: 0; }
.idea-crit dt { color: var(--ink-3); }
.idea-crit dd { margin: 0; }
.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.stage { padding: 2px 0 2px 0; display: grid; gap: 4px; min-width: 0; }
.stage > p, .stage > div { padding-left: 22px; }
.stage-k { font-size: var(--t-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.stage-k .n { width: 16px; height: 16px; border-radius: 50%; background: var(--line); color: var(--ink); display: inline-grid; place-items: center; font-size: 10px; letter-spacing: 0; }
.stage.locked .stage-k { color: var(--ink-3); }
.stage p { font-size: var(--t-m); }
.tpl { display: flex; align-items: flex-start; gap: 6px; min-width: 0; flex-wrap: wrap; }
.tpl code { flex: 1 1 180px; display: block; padding: 6px 8px; background: var(--surface); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.tpl .z { border-bottom: 1.5px solid var(--warn); }
.tpl .ph { background: var(--surface-2); color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: 3px; padding: 0 3px; font-style: italic; }

/* Knöpfe */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: var(--t-m); font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn-primary:hover { border-color: var(--ink); opacity: .9; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); border-color: transparent; }
.btn-s { height: 26px; padding: 0 9px; font-size: var(--t-s); }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.link { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; font-size: var(--t-s); display: inline-flex; align-items: center; gap: 4px; }
.link:hover { color: var(--ink); text-decoration-color: var(--ink); }
.field { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.sel, .inp { height: 30px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: var(--t-m); min-width: 0; }
.inp { flex: 1 1 140px; }
textarea.inp { height: auto; min-height: 76px; padding: 6px 8px; line-height: 1.45; resize: vertical; width: 100%; }

/* Host-Detail */
.d-top { display: flex; align-items: center; gap: 6px; margin: -4px 0 4px -6px; }
.d-back { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); font-size: var(--t-s); font-weight: 500; }
.d-back:hover { background: var(--surface-2); color: var(--ink); }
.d-back .ic { transform: rotate(180deg); }
.d-head { display: flex; gap: 12px; align-items: center; padding-bottom: 6px; min-width: 0; }
.d-head .acc-sym { width: 32px; height: 32px; font-size: 17px; border-radius: 8px; }
.d-head.acc-user .acc-sym { background: var(--user); border-color: var(--user); color: var(--on-strong); }
.d-head.acc-root .acc-sym { background: var(--root); border-color: var(--root); color: var(--on-strong); }
.d-head.fog .acc-sym { border-style: dotted; border-color: var(--fog); background: transparent; }
.d-head.kali .acc-sym { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.d-title { display: grid; min-width: 0; }
.d-title h2 { font-size: var(--t-xl); font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.d-title .mono { font-size: var(--t-s); color: var(--ink-2); overflow-wrap: anywhere; }
.d-over { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; font-size: var(--t-m); margin: 2px 0 8px; align-items: baseline; }
.d-over dt { color: var(--ink-3); font-size: var(--t-s); }
.d-over dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.acc-word { font-weight: 600; font-family: var(--f-mono); }
.acc-word.u { color: var(--user); }
.acc-word.r { color: var(--root); }
.warn-word { color: var(--warn); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.d-note { font-size: var(--t-s); color: var(--ink-2); padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.d-sec { border-top: 1px solid var(--line); min-width: 0; }
.d-sec > summary {
  list-style: none; display: flex; align-items: center; gap: 8px; padding: 11px 2px; cursor: pointer; font-weight: 600; font-size: var(--t-m); color: var(--ink);
}
.d-sec > summary::-webkit-details-marker { display: none; }
.d-sec > summary .ic { color: var(--ink-3); transition: transform .15s; }
.d-sec[open] > summary .ic { transform: rotate(90deg); }
.d-sec > summary .n { margin-left: auto; color: var(--ink-3); font-weight: 400; font-size: var(--t-s); }
.d-sec > summary .n.warn { color: var(--warn); font-weight: 600; }
.d-sec > summary:hover { color: var(--ink); }
.d-body { padding: 0 2px 14px; display: grid; gap: 8px; min-width: 0; }
.svc-list { list-style: none; margin: 0; padding: 0; display: grid; }
.svc-row {
  display: grid; grid-template-columns: 50px 86px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; width: 100%;
  padding: 5px 6px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: var(--t-s); color: var(--ink);
}
.svc-row:hover { background: var(--surface-2); }
.svc-row .p { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; }
.svc-row .s { font-family: var(--f-mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.svc-row .pr { color: var(--ink-3); overflow-wrap: anywhere; min-width: 0; }
.svc-row .x { grid-column: 3; display: flex; flex-wrap: wrap; gap: 4px; }
.svc-row.cand .s, .svc-row.cand .p { color: var(--ink-2); font-style: italic; }
.cred { display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: var(--t-s); min-width: 0; }
.cred-top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.cred-top .mono { font-size: var(--t-m); font-weight: 600; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: var(--t-s); margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.src-list { display: grid; gap: 2px; }
.src-row { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 6px; border: 0; background: transparent; text-align: left; font-size: var(--t-s); min-width: 0; width: 100%; color: var(--ink-2); }
.src-row:hover { background: var(--surface-2); color: var(--ink); }
.src-row .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; color: var(--ink); }
.src-row time { color: var(--ink-3); }

/* Erste Schritte (leeres Projekt) */
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.checklist li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; }
.ck { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: var(--t-s); font-weight: 600; color: var(--ink-3); }
.ck.done { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.ck-body { display: grid; gap: 6px; min-width: 0; }
.cmdline { display: flex; align-items: center; gap: 6px; min-width: 0; }
.cmdline code { flex: 1 1 auto; min-width: 0; padding: 4px 8px; }

/* Ganze Ansichten: Terminals, Zeitachse, Findings */
.page { min-height: 0; min-width: 0; overflow: auto; padding-inline: 16px; padding-block: 22px 40px; }
.page-in { max-width: 1080px; margin: 0 auto; display: grid; gap: 16px; min-width: 0; }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.page-head h1 { font-size: var(--t-xl); font-weight: 600; }
.page-head .sub { color: var(--ink-3); font-size: var(--t-m); }
.empty-note { padding: 24px; text-align: center; color: var(--ink-3); border: 1px dashed var(--line-2); border-radius: 10px; }
.term-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; align-items: start; }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; align-content: start; min-width: 0; }
.term.unknown { border-color: var(--warn); }
.term-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.term-head h2 { font-size: var(--t-l); font-family: var(--f-mono); font-weight: 600; }
.rec-mini { display: inline-flex; align-items: center; gap: 5px; font-size: var(--t-xs); font-weight: 700; letter-spacing: .08em; color: var(--ink-2); }
.rec-mini::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--rec); }
.rec-mini.off { color: var(--warn); }
.rec-mini.off::before { background: transparent; border: 1.5px solid var(--warn); }
.term-body { padding: 10px 12px 12px; display: grid; gap: 10px; min-width: 0; }
.term-last { font-family: var(--f-mono); font-size: var(--t-s); background: var(--map); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; }
.unk-box { border: 1px dashed var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px; display: grid; gap: 8px; font-size: var(--t-s); }
.unk-box strong { color: var(--warn); display: inline-flex; gap: 4px; align-items: center; }
.crumbs { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.crumb { display: inline-flex; align-items: center; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); font-family: var(--f-mono); font-size: var(--t-s); white-space: nowrap; }
.crumb.unk { background: var(--warn-bg); color: var(--warn); border: 1px dashed var(--warn); font-weight: 600; }
.crumb-sep { color: var(--ink-3); }
.tl-filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.tl-filters label { font-size: var(--t-s); color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--line-2); background: transparent; color: var(--ink-3); font-size: var(--t-s); font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--ink-3); }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 94.5px; top: 0; bottom: 0; width: 1px; background: var(--line-2); }

  toast('Darstellung: ' + { auto: 'automatisch', light: 'hell', dark: 'dunkel' }[state.theme] + '.');
}
function refreshCyStyle() { if (cy) requestAnimationFrame(function () { cy.style(cyStyle()); }); }
function togglePres() {
  state.pres = !state.pres;
  if (state.pres) state.revealed = {};
  renderAll(false);
  if (state.pop === 'menu') renderMenu();
  if (!$('#evidence').hidden && evCur) drawEvidence(evCur.id, evCur.mk);
  toast(state.pres ? 'Präsentationsmodus an. Secrets sind überall maskiert.' : 'Präsentationsmodus aus.');
}
function setEmpty(on) {
  state.empty = on;
  stopPlay();
  state.replay = false;
  state.step = on ? 0 : LIVE;
  if (on) { state.detail = null; }
  state.cur = 'i-ctx';
  rebuild(); prevSig = {}; prevEdges = {};
  renderAll();
  if (state.pop === 'menu') renderMenu();
  go('karte');
  requestAnimationFrame(function () { fitMap(false); });
}
function resetDecisions() {
  state.dec = { inbox: {}, work: {}, conflict: null, ctx: {}, tags: {}, notes: {} };
  TERM_STATE.t3.stack = [{ label: 'Kali', user: 'kali' }, { label: 'unbekannt', kind: 'revshell', unknown: true }];
  state.ideaStatus = {}; state.ideaStage = {}; state.ideas = IDEAS.slice(); state.findingEv = {}; state.cur = 'i-ctx'; state.sinceSeen = false;
  renderAll(); toast('Alle Entscheide zurückgesetzt.');
}
var toastTimer = null;
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.hidden = false;
  /* Auf dem Desktop links unten auf der Karte, beim Abspielen über der Abspielleiste */
  t.style.bottom = state.replay && state.view === 'karte' && !mobileQuery.matches ? ($('#playbar').offsetHeight + 26) + 'px' : '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, 3400);
}

/* ------------------------------------------------------------------
   Verdrahtung
   ------------------------------------------------------------------ */
$('#recBtn').addEventListener('click', toggleRec);
$('#paletteBtn').addEventListener('click', openPalette);
$('#menuBtn').addEventListener('click', function () { togglePop('menu'); });
$('#layersBtn').replaceChildren(icon('layers', 's'), h('span', { class: 'lbl', text: 'Ebenen' }));
$('#playToolBtn').replaceChildren(icon('play', 's'), h('span', { class: 'lbl', text: 'Abspielen' }));
$('#fitBtn').replaceChildren(icon('fit', 's'), h('span', { class: 'lbl', text: 'Einpassen' }));
$('#layersBtn').setAttribute('aria-label', 'Ebenen und Legende');
$('#playToolBtn').setAttribute('aria-label', 'Session abspielen');
$('#fitBtn').setAttribute('aria-label', 'Karte einpassen');
$('#layersBtn').addEventListener('click', function () { togglePop('layers'); });
$('#playToolBtn').addEventListener('click', function () { if (state.replay) closeReplay(); else openReplay(); });
$('#fitBtn').addEventListener('click', function () { fitMap(true); });
$('#oosBand').addEventListener('click', function () { togglePop('oos'); });
$('#playBtn').addEventListener('click', function () { if (state.step === LIVE && !state.playing) setStep(0, true); togglePlay(); });
$('#liveBtn').addEventListener('click', closeReplay);
$('#stepRange').addEventListener('input', function (e) { var v = +e.target.value; stopPlay(); setStep(v, true); });

/* Aussenklick schliesst Popover. composedPath, weil Inhalte beim Klick neu gezeichnet werden können. */
var POP_IDS = ['mainMenu', 'menuBtn', 'layersPop', 'layersBtn', 'oosPop', 'oosBand', 'lockPop', 'lockPill'];
document.addEventListener('click', function (e) {
  if (!state.pop) return;
  var path = e.composedPath ? e.composedPath() : [];
  var inside = path.some(function (n) { return n && n.id && POP_IDS.indexOf(n.id) >= 0; });
  if (!inside) closePops();
});
/* Tab bleibt im offenen Dialog */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab') return;
  var m = ['#palette', '#help', '#evidence'].map(function (s) { return $(s); }).filter(function (x) { return !x.hidden; })[0];
  if (!m) return;
  var f = $$('button, input, select, textarea, [tabindex]:not([tabindex="-1"])', m).filter(function (x) { return !x.disabled && !x.closest('[hidden]') && x.getClientRects().length; });
  if (!f.length) return;
  var i = f.indexOf(document.activeElement);
  if (i < 0 && m.contains(document.activeElement) && document.activeElement !== m) return; /* z. B. scrollbares Log */
  if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && (i < 0 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
});
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if ($('#palette').hidden) openPalette(); else closePalette(); return; }
  if (e.key === 'Escape') {
    if (!$('#palette').hidden) { closePalette(); return; }
    if (!$('#help').hidden) { closeHelp(); return; }
    if (!$('#evidence').hidden) { closeEvidence(); return; }
    if (state.pop) { closePops(true); return; }
    if (state.detail && state.view === 'karte') { closeDetail(); if (!$('#side').contains(document.activeElement)) focusCur(); return; }
    return;
  }
  var tgt = e.target;
  var typing = tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.tagName === 'SELECT' || tgt.isContentEditable);
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('#evidence').hidden || !$('#palette').hidden || !$('#help').hidden) return;
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }
  if (state.view !== 'karte' || state.pop) return;
  if (e.key === '+' || e.key === '=') { zoomBy(1.25); e.preventDefault(); return; }
  if (e.key === '-' || e.key === '−') { zoomBy(1 / 1.25); e.preventDefault(); return; }
  if (e.key === '0') { fitMap(true); e.preventDefault(); return; }
  if (!state.detail && !state.empty) queueKeys(e);
});
$('#evidence').addEventListener('click', function (e) { if (e.target === $('#evidence')) closeEvidence(); });
$('#palette').addEventListener('click', function (e) { if (e.target === $('#palette')) closePalette(); });
$('#help').addEventListener('click', function (e) { if (e.target === $('#help')) closeHelp(); });

darkQuery.addEventListener('change', refreshCyStyle);
/* Die Karte passt sich jeder Grössenänderung an */
var resizeTimer = null;
function scheduleFit() { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { fitMap(true); }, 90); }
if ('ResizeObserver' in window) new ResizeObserver(scheduleFit).observe($('#mapCanvas'));
else window.addEventListener('resize', scheduleFit);
setInterval(function () { if (state.rec && !state.recPending) { state.recSecs++; $('#recTime').textContent = fmtDur(state.recSecs); } }, 1000);

/* Start */
applyTheme();
initCy();
renderMenu();
renderAll(false);
VIEWS.forEach(function (v) { $('#view-' + v.id).hidden = v.id !== state.view; });
requestAnimationFrame(function () { fitMap(false); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { refreshCyStyle(); scheduleFit(); });
})();
</script>
